services:
  knowledgeshelf:
    build: .
    image: knowledgeshelf:local
    ports:
      - "13378:80"
    volumes:
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
      - ./metadata:/metadata
      - ./config:/config
    environment:
      TZ: ${TZ:-UTC}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    restart: unless-stopped
