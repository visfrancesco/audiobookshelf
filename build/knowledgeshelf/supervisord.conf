[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/knowledgeshelf-supervisor.pid

[program:backend]
command=node /app/index.js
priority=10
environment=PORT="3333",HOST="127.0.0.1"
autorestart=unexpected
startsecs=3
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=php-fpm85 --fpm-config /etc/knowledgeshelf/php-fpm.conf --nodaemonize
priority=20
autorestart=unexpected
stopsignal=QUIT
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gateway]
command=caddy run --config /etc/knowledgeshelf/Caddyfile --adapter caddyfile
priority=30
autorestart=unexpected
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
