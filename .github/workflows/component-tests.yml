name: KnowledgeShelf Web Checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['web/**', '.github/workflows/component-tests.yml']
  push:
    paths: ['web/**', '.github/workflows/component-tests.yml']

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PHP and frontend dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          composer install --prefer-dist --no-interaction
          cp .env.example .env
          php artisan key:generate
          npm ci
      - name: Build the production interface
        run: npm run build
      - name: Test pages, permissions, API contracts, and playback
        run: |
          vendor/bin/phpunit
          npm test
      - name: Check PHP formatting
        run: |
          vendor/bin/pint --format agent
          git diff --exit-code
      - name: Check cached routes and views
        run: |
          php artisan route:cache
          php artisan view:cache
