name: Run Unit Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/Tag/SHA to test'
        required: true
  pull_request:
  push:

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (push/pull request)
        uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'

      - name: Checkout (workflow_dispatch)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
        if: github.event_name == 'workflow_dispatch'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install media test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils python3-venv
          python3 -m venv /tmp/knowledge-tools
          /tmp/knowledge-tools/bin/pip install -r tools/requirements-knowledge.txt
          /tmp/knowledge-tools/bin/yt-dlp --ignore-config --js-runtimes node --no-remote-components --version
          pdftotext -v

      - name: Run tests
        run: |
          npm test
          python3 -B -m unittest discover -s test/tools -v
