name: Build and Publish Fork Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'build/knowledgeshelf/**'
      - 'server/**'
      - 'test/**'
      - 'tools/**'
      - 'index.js'
      - 'package*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [master]
    tags: ['v*-vfh.*']

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    uses: ./.github/workflows/component-tests.yml

  validate:
    needs: web
    name: Test server and container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
          npm ci
      - name: Test server and lifecycle adapter
        run: |
          npm test
          python3 -B -m unittest discover -s test/tools -v
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: abs-review:${{ github.sha }}
          cache-from: type=gha,scope=fork-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.arch }}
      - name: Test container startup and persistence
        run: |
          python3 tools/test-release-image.py abs-review:${{ github.sha }}
          python3 tools/test-release-image.py abs-review:${{ github.sha }} --upgrade-from ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e

      - name: Start isolated browser fixture
        if: matrix.arch == 'amd64'
        run: |
          docker run -d --name knowledgeshelf-browser -p 127.0.0.1:18937:80 abs-review:${{ github.sha }}
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18937/status > /dev/null; then break; fi
            sleep 1
          done
          python3 test/integration/web.py http://127.0.0.1:18937
      - name: Test navigation, playback, and responsive layouts in a browser
        if: matrix.arch == 'amd64'
        working-directory: web
        run: |
          npm ci
          npm run test:browser
      - name: Save browser screenshots
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: knowledgeshelf-browser-screenshots
          path: web/tests/Browser/screenshots
          if-no-files-found: ignore
      - name: Stop browser fixture
        if: always() && matrix.arch == 'amd64'
        run: docker rm -f knowledgeshelf-browser || true

  publish:
    name: Publish image (${{ matrix.arch }})
    needs: validate
    if: github.repository == 'visfrancesco/audiobookshelf' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and merged commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-vfh\.[0-9]+$ ]]
          test "${BASH_REMATCH[1]}" = "$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD origin/master
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable release reference
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=fork-${{ matrix.arch }}
      - name: Record architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > digest-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt

  manifest:
    name: Publish multi-platform release reference
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify the release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:${RELEASE_TAG#v}"
          amd64_digest="$(cat digests/digest-amd64.txt)"
          arm64_digest="$(cat digests/digest-arm64.txt)"
          [[ "$amd64_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create --tag "$image" "$repository@$amd64_digest" "$repository@$arm64_digest"
          docker buildx imagetools inspect "$image" --raw > manifest.json
          python3 -c 'import json; m=json.load(open("manifest.json")); platforms={(i["platform"]["os"],i["platform"]["architecture"]) for i in m["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= platforms'
          docker buildx imagetools inspect "$image" > image-inspect.txt
          digest="$(awk '$1 == "Digest:" {print $2; exit}' image-inspect.txt)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s@%s\n' "$image" "$digest" > image-reference.txt
          cat image-reference.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-reference
          path: image-reference.txt
