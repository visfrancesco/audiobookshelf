name: Integration Test

on:
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**' # Don't run dependabot branches, as they are already covered by pull requests
    # Only build when files in these directories have been changed
    paths:
      - client/**
      - server/**
      - test/**
      - index.js
      - package.json

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install pkg (using yao-pkg fork for targeting node20)
        run: npm install -g @yao-pkg/pkg

      - name: get client dependencies
        working-directory: client
        run: npm ci

      - name: build client
        working-directory: client
        run: npm run generate

      - name: get server dependencies
        run: npm ci --only=production

      - name: Install document tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: build binary
        run: pkg -t node20-linux-x64 -o audiobookshelf .

      - name: run binary and wait for readiness
        run: |
          ./audiobookshelf > /tmp/abs-startup.log 2>&1 &
          abs_pid=$!
          trap 'kill "$abs_pid" 2>/dev/null || true' EXIT
          # First startup downloads media/SQLite binaries before opening the port.
          for attempt in $(seq 1 60); do
            if ! kill -0 "$abs_pid" 2>/dev/null; then
              cat /tmp/abs-startup.log
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:3333 -o /tmp/abs-index.html 2>/dev/null && grep -q Audiobookshelf /tmp/abs-index.html; then
              mkdir -p /tmp/knowledge-integration-books
              python3 tools/knowledge_smoke.py http://127.0.0.1:3333 --library-path /tmp/knowledge-integration-books
              exit 0
            fi
            sleep 2
          done
          cat /tmp/abs-startup.log
          exit 1
